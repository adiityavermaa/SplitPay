<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SplitPay | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Outfit', sans-serif; background-color: #050505; color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; } 
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); } 
        .bg-glow { position: absolute; width: 400px; height: 400px; background: radial-gradient(circle, rgba(138, 43, 226, 0.15) 0%, rgba(0,0,0,0) 70%); top: -100px; right: -100px; z-index: -1; border-radius: 50%; }
    </style>
</head>
<body>
    <div class="bg-glow"></div>

    <div class="glass w-full max-w-sm p-8 rounded-3xl relative z-10" id="login-card">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-extrabold tracking-tight">SplitPay</h1>
            <p class="text-xs text-gray-400 mt-2">Secure Payments</p>
        </div>

        <!-- STEP 1: Phone Number -->
        <div id="step-phone" class="space-y-4">
            <p class="text-sm text-gray-300 text-center mb-2">Enter your mobile number</p>
            <div class="relative">
                <span class="absolute left-4 top-3.5 text-gray-400 font-semibold">+91</span>
                <input type="tel" id="phone" maxlength="10" placeholder="Phone Number" class="w-full bg-black/50 border border-white/10 rounded-xl py-3 pl-14 pr-4 text-white focus:outline-none focus:border-green-400 transition">
            </div>
            <button onclick="sendOtp()" class="w-full bg-gradient-to-r from-green-400 to-blue-500 text-black font-bold py-3 rounded-xl hover:shadow-[0_0_20px_rgba(0,255,136,0.5)] transition">
                Send OTP
            </button>
        </div>

        <!-- STEP 2: OTP (Hidden initially) -->
        <div id="step-otp" class="space-y-4 hidden">
            <p class="text-sm text-gray-300 text-center mb-2">Enter OTP sent to <span id="display-phone" class="font-bold text-white"></span></p>
            <input type="text" id="otp" maxlength="6" placeholder="1 2 3 4 5 6" class="w-full bg-black/50 border border-white/10 rounded-xl py-3 px-4 text-center text-2xl tracking-[0.5em] font-bold text-white focus:outline-none focus:border-green-400 transition">
            <button onclick="verifyOtp()" class="w-full bg-gradient-to-r from-green-400 to-blue-500 text-black font-bold py-3 rounded-xl hover:shadow-[0_0_20px_rgba(0,255,136,0.5)] transition mt-2">
                Verify & Login
            </button>
            <p class="text-center text-xs text-gray-500 mt-4 cursor-pointer hover:text-white" onclick="window.location.reload()">Wrong number? Go back</p>
        </div>
    </div>

    <script>
        let currentPhone = "";

        function sendOtp() {
            currentPhone = document.getElementById('phone').value;
            
            if(currentPhone.length !== 10 || isNaN(currentPhone)) {
                alert("Please enter a valid 10-digit phone number.");
                return;
            }

            // Tell backend to mock sending OTP
            fetch('/api/request-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: currentPhone })
            }).then(() => {
                // Smooth GSAP animation to hide phone step, show OTP step
                gsap.to("#step-phone", { duration: 0.3, opacity: 0, y: -20, onComplete: () => {
                    document.getElementById('step-phone').classList.add('hidden');
                    document.getElementById('step-otp').classList.remove('hidden');
                    
                    // Animate OTP step in
                    gsap.fromTo("#step-otp", {opacity: 0, y: 20}, {duration: 0.3, opacity: 1, y: 0});
                    document.getElementById('display-phone').innerText = "+91 " + currentPhone;
                    
                    // Focus the OTP input box automatically
                    document.getElementById('otp').focus();
                }});
            });
        }

        function verifyOtp() {
            const otp = document.getElementById('otp').value;
            
            if(otp.length !== 6) {
                alert("Please enter the 6-digit OTP.");
                return;
            }

            fetch('/api/verify-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: currentPhone, otp: otp })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    // Smooth slide out before redirecting
                    gsap.to("#login-card", { duration: 0.4, y: -50, opacity: 0, onComplete: () => {
                        window.location.href = data.redirect;
                    }});
                } else {
                    alert(data.message); // Shows "Invalid OTP"
                }
            });
        }
    </script>
</body>
</html>
