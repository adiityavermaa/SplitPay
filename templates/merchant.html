<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SplitPay | Merchant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #000000; color: white; overflow-x: hidden; padding-bottom: 80px; }
        .glass-card { background: #121212; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05); }
        .wallet-card { background: linear-gradient(145deg, #1a1a1a, #0a0a0a); border-radius: 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(0, 255, 136, 0.1); }
        @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(0, 255, 136, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); } }
        .pulse-receive { animation: pulse-ring 2s infinite; }
    </style>
</head>
<body class="relative">

    <div class="w-full max-w-md mx-auto p-5">
        <!-- Header -->
        <div class="flex justify-between items-center mb-6 pt-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight">Merchant Hub</h1>
                <p class="text-xs text-green-400 mt-1" id="merchant-upi-display">{{ merchant_upi }}</p>
            </div>
            <a href="/logout" class="w-10 h-10 rounded-full bg-gray-900 border border-gray-800 flex items-center justify-center hover:bg-red-500/20 transition">
                <svg class="w-5 h-5 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            </a>
        </div>

        <!-- QR Code Card -->
        <div class="wallet-card p-6 mb-6 text-center relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-green-500 to-transparent opacity-50"></div>
            <p class="text-sm font-medium text-gray-400 mb-4">Scan to Pay Merchant</p>
            
            <div class="bg-white p-3 rounded-2xl inline-block mb-4 shadow-[0_0_30px_rgba(0,255,136,0.15)]">
                <div id="qrcode"></div>
            </div>
            
            <h2 class="text-2xl font-bold tracking-widest text-white">₹ <span id="total-received">0.00</span></h2>
            <p class="text-xs text-gray-500 mt-1">Total Received Today</p>
        </div>

        <!-- Live Feed -->
        <div class="flex justify-between items-center mb-3 px-2">
            <h3 class="text-sm font-semibold text-gray-300">Live Payments</h3>
            <div class="flex items-center gap-2">
                <span class="relative flex h-3 w-3">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                </span>
                <span class="text-[10px] text-gray-500 uppercase tracking-widest">Listening...</span>
            </div>
        </div>

        <div class="space-y-3" id="live-feed">
            <p class="text-xs text-gray-500 text-center py-6">Waiting for your first payment...</p>
        </div>
    </div>

    <script>
        const merchantUpi = "{{ merchant_upi }}";
        let lastTxnId = "";
        let totalReceived = 0;
        let hasLoadedInitial = false;

        // 1. Generate the QR Code
        new QRCode(document.getElementById("qrcode"), {
            text: `upi://pay?pa=${merchantUpi}&pn=Merchant`,
            width: 180, height: 180, colorDark : "#000000", colorLight : "#ffffff"
        });

        // 2. Audio for "Ding"
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playDing() {
            var osc = audioCtx.createOscillator();
            var gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        // 3. Poll for Payments
        function fetchPayments() {
            fetch('/api/merchant/received')
                .then(res => res.json())
                .then(data => {
                    if(data.length > 0) {
                        const feed = document.getElementById('live-feed');
                        
                        if(!hasLoadedInitial) {
                            feed.innerHTML = "";
                            hasLoadedInitial = true;
                        }

                        const newestTxn = data[0];
                        if(newestTxn.txn_id !== lastTxnId) {
                            lastTxnId = newestTxn.txn_id;
                            
                            if(feed.innerHTML !== "") playDing(); 

                            totalReceived = data.reduce((sum, txn) => sum + txn.amount, 0);
                            document.getElementById('total-received').innerText = totalReceived.toFixed(2);

                            feed.innerHTML = "";
                            data.forEach((txn, index) => {
                                // Parse split data and UTRs
                                let splitHTML = "";
                                if(txn.split_data) {
                                    const chunks = txn.split_data.split(',');
                                    // Get UTRs or fallback to empty array
                                    const utrs = (txn.split_utrs && txn.split_utrs !== 'None') ? txn.split_utrs.split(',') : [];
                                    
                                    splitHTML = `
                                        <div class="mt-3 space-y-1">
                                            ${chunks.map((c, i) => `
                                                <div class="flex justify-between items-center bg-green-500/5 px-3 py-2 rounded-lg border border-green-500/10">
                                                    <span class="text-green-400 text-xs font-bold">₹${c}</span>
                                                    <span class="text-gray-500 text-[10px] font-mono">${utrs[i] || 'UTR Pending'}</span>
                                                </div>
                                            `).join('')}
                                        </div>
                                    `;
                                }

                                const animClass = index === 0 ? "animate-[pulse_1s_ease-in-out_1]" : "";
                                const borderClass = index === 0 ? "border-green-500/50 shadow-[0_0_15px_rgba(0,255,136,0.2)]" : "border-gray-800";

                                feed.innerHTML += `
                                    <div class="glass-card p-4 border ${borderClass} ${animClass} mb-3">
                                        <div class="flex justify-between items-start">
                                            <div class="flex items-center gap-3">
                                                <div class="w-10 h-10 rounded-full bg-green-500/20 flex items-center justify-center text-green-400 font-bold text-lg">
                                                    ₹
                                                </div>
                                                <div>
                                                    <p class="text-sm font-bold text-white">${txn.sender}</p>
                                                    <p class="text-[10px] text-gray-500">${txn.date}</p>
                                                </div>
                                            </div>
                                            <div class="text-right">
                                                <p class="text-lg font-extrabold text-green-400">+ ₹${txn.amount}</p>
                                                <p class="text-[9px] text-gray-600 font-mono mt-1">${txn.txn_id}</p>
                                            </div>
                                        </div>
                                        ${splitHTML}
                                    </div>
                                `;
                            });
                        }
                    }
                })
                .catch(err => console.log("Waiting for server..."));
        }

        fetchPayments();
        setInterval(fetchPayments, 3000);
    </script>
</body>
</html>
